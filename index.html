<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070c14">
  
  <!-- PWA & Mobile Meta Tags (Native App Feel) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TW-HK Live Signals">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <title>TW-HK Live Signal's App</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* APPEARANCE VARIABLES (Can be changed from settings) */
    :root {
      --navy-950: #070c14;
      --navy-900: #0b1420;
      --navy-800: #101c2c;
      --gold: #c9a227;
      --gold-bright: #e8c65a;
      --green: #3ecf8e;
      --red: #e2564f;
      --blue: #4a9eff;
      --purple: #9b6bd9;
      --ink: #e9edf3;
      --ink-dim: #8fa0b8;
      --line: #22314a;
      --card-bg: #0b1420;
      --sub-bg: #070c14;
      
      /* Dynamic Settings */
      --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --signal-size: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    /* Allow selection only in inputs */
    input, textarea { user-select: text; }

    body {
      margin: 0;
      background: var(--navy-950);
      color: var(--ink);
      font-family: var(--font-main);
      font-size: var(--signal-size);
      min-height: 100vh;
      padding: 12px 12px 60px;
      overflow-x: hidden;
      /* Smooth native-like scroll */
      -webkit-overflow-scrolling: touch; 
    }

    /* Scrollbar Hidden for Native Feel */
    ::-webkit-scrollbar { display: none; }

    .wrap { max-width: 500px; margin: 0 auto; position: relative; }

    /* Header & Settings Icon (Top Right) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: var(--navy-900);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .brand { font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold-bright); font-weight: 700; }
    .brand span { color: var(--ink); }
    .tag { color: var(--ink-dim); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
    
    .header-actions { display: flex; align-items: center; gap: 12px; }
    
    /* SVG Settings Icon */
    .settings-icon {
      width: 22px; height: 22px; fill: var(--gold-bright); cursor: pointer;
    }

    /* Full Screen Login Modal */
    #loginOverlay {
      position: fixed; inset: 0; background: var(--navy-950); z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; transition: opacity 0.4s ease;
    }
    .login-box { background: var(--navy-900); border: 1px solid var(--gold); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center; }
    .logo-placeholder { width: 60px; height: 60px; border-radius: 12px; background: var(--gold); margin: 0 auto 16px; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; font-size:10px; }

    /* Member Dashboard */
    .member-dashboard {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: var(--navy-900); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 12px;
    }
    .dash-box { text-align: center; background: var(--sub-bg); padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
    .dash-title { font-size: 9px; color: var(--ink-dim); text-transform: uppercase; font-weight: bold; }
    .dash-val { font-size: 13px; font-weight: 800; font-family: var(--font-mono); color: var(--ink); margin-top: 3px; }
    
    /* Buttons & Inputs */
    input, select { width: 100%; background: var(--sub-bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 10px 12px; font-size: 13px; margin-bottom: 8px; font-family: var(--font-main); outline:none; }
    input:focus, select:focus { border-color: var(--gold); }
    
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--gold); color: #070c14; font-weight: 700; font-size: 13px; cursor: pointer; text-transform: uppercase; }
    
    /* Signal Card */
    .feed-item { background: var(--card-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .feed-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pair-name { font-size: 16px; font-weight: 800; }
    
    /* Price Tick Animation */
    .live-price { font-family: var(--font-mono); font-size: 15px; font-weight: 800; transition: color 0.3s; }
    .price-up { color: var(--green); text-shadow: 0 0 8px rgba(62, 207, 142, 0.4); }
    .price-down { color: var(--red); text-shadow: 0 0 8px rgba(226, 86, 79, 0.4); }
    
    .pnl-live { font-family: var(--font-mono); font-size: 13px; font-weight: 800; }

    /* Settings Modal */
    .modal { position: fixed; inset: 0; background: var(--navy-950); z-index: 99999; display: none; padding: 20px; overflow-y: auto; }
    .modal.active { display: block; }
    .modal-close { float: right; font-size: 20px; color: var(--gold); cursor: pointer; font-weight: bold; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. LOGIN OVERLAY (With Logo placeholder) -->
  <div id="loginOverlay">
    <div class="login-box">
      <div class="logo-placeholder">LOGO<br>HERE</div>
      <div class="brand" style="margin-bottom:4px;">TW<span>-</span>HK</div>
      <div style="font-size:11px; color:var(--ink-dim); margin-bottom:20px;">Live Signal's App</div>
      <input type="email" id="loginEmail" placeholder="Email Address">
      <input type="password" id="loginPass" placeholder="Password">
      <button class="btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <div class="wrap">
    <!-- 2 & 5. HEADER (Name Changed & Settings Icon) -->
    <header>
      <div>
        <div class="brand">TW<span>-</span>HK</div>
        <div class="tag">Live Signal's App</div>
      </div>
      <div class="header-actions">
        <!-- Professional SVG Settings Icon -->
        <svg class="settings-icon" onclick="openSettings()" viewBox="0 0 24 24">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </div>
    </header>

    <!-- 9. MEMBER DASHBOARD -->
    <div class="member-dashboard">
      <div class="dash-box"><div class="dash-title">Total Trades</div><div class="dash-val" id="dashTotal">12</div></div>
      <div class="dash-box"><div class="dash-title">Win (TP/BE)</div><div class="dash-val" style="color:var(--green)">8</div></div>
      <div class="dash-box"><div class="dash-title">Loss (SL)</div><div class="dash-val" style="color:var(--red)">4</div></div>
      <div class="dash-box" style="grid-column: span 3; text-align:center;">
        <div class="dash-title">Net Profit/Loss</div>
        <div class="dash-val" id="dashPnL" style="color:var(--gold-bright); font-size:18px;">+$450.00</div>
      </div>
    </div>

    <!-- ADMIN & SIGNAL TOGGLE -->
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <button class="btn" style="background:var(--navy-800); color:var(--gold);" onclick="showView('signals')">Live Signals</button>
      <button class="btn" style="background:var(--navy-800); color:var(--ink-dim);" onclick="showView('admin')">Admin Hub</button>
    </div>

    <!-- SIGNALS VIEW -->
    <div id="view-signals">
      <!-- Dummy Signal (Will be updated live) -->
      <div class="feed-item" id="sig-BTCUSDT">
        <div class="feed-top">
          <div class="pair-name">BTCUSDT <span style="font-size:10px; color:var(--green); border:1px solid var(--green); padding:2px 4px; border-radius:4px; margin-left:6px;">LONG</span></div>
          <div class="live-price" id="price-BTCUSDT">Loading...</div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:10px; color:var(--ink-dim);">
          <div>Entry: <span style="color:var(--blue)">63000.0</span></div>
          <div>TP: <span style="color:var(--green)">65000.0</span></div>
          <div>SL: <span style="color:var(--red)">62000.0</span></div>
        </div>
        <div style="text-align:right;">
          <span style="font-size:10px; color:var(--ink-dim);">Current PnL: </span>
          <span class="pnl-live" id="pnl-BTCUSDT">$0.00</span>
        </div>
      </div>
    </div>

    <!-- 11. ADMIN VIEW (Auto Detect Logic) -->
    <div id="view-admin" class="hidden">
      <div style="background:var(--navy-900); padding:15px; border-radius:12px; border:1px solid var(--line);">
        <h3 style="margin-top:0; color:var(--gold); font-size:14px; text-transform:uppercase;">Deploy New Signal</h3>
        
        <label style="font-size:10px; color:var(--ink-dim);">Pair (e.g. BTCUSDT, EURUSD)</label>
        <input type="text" id="deployPair" placeholder="Enter Pair" oninput="autoDetectTrade()">
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="font-size:10px; color:var(--ink-dim);">Entry Price</label>
            <input type="number" id="deployEntry" placeholder="0.000" oninput="autoDetectTrade()">
          </div>
          <div>
            <label style="font-size:10px; color:var(--ink-dim);">Take Profit 1</label>
            <input type="number" id="deployTP1" placeholder="0.000" oninput="autoDetectTrade()">
          </div>
        </div>
        
        <!-- Auto Detected Fields (Readonly for visual confirmation) -->
        <div style="display:flex; gap:10px; margin-top:10px; margin-bottom:15px;">
          <input type="text" id="deployMarket" placeholder="Market (Auto)" readonly style="background:var(--navy-950); color:var(--gold-bright);">
          <input type="text" id="deployDir" placeholder="Direction (Auto)" readonly style="background:var(--navy-950); color:var(--blue);">
        </div>

        <button class="btn">Deploy Signal</button>
      </div>
    </div>
  </div>

  <!-- 8 & 10. SETTINGS MODAL -->
  <div id="settingsModal" class="modal">
    <div class="modal-close" onclick="closeSettings()">X</div>
    <h2 style="color:var(--gold); font-family:'Cinzel', serif;">App Settings</h2>
    
    <h3 style="font-size:12px; color:var(--ink-dim); margin-top:20px;">API Configurations</h3>
    <input type="text" id="apiLondonEdge" placeholder="LondonStrategicEdge API Key">
    
    <h3 style="font-size:12px; color:var(--ink-dim); margin-top:20px;">Appearance (Theme)</h3>
    <label style="font-size:11px; color:var(--ink);">Signal Card Size</label>
    <select id="settingSize" onchange="changeAppearance()">
      <option value="12px">Normal</option>
      <option value="14px">Large</option>
      <option value="10px">Small</option>
    </select>
    
    <label style="font-size:11px; color:var(--ink);">Accent Color</label>
    <select id="settingColor" onchange="changeAppearance()">
      <option value="#e8c65a">Gold (Default)</option>
      <option value="#4a9eff">Blue</option>
      <option value="#3ecf8e">Green</option>
    </select>

    <button class="btn" style="margin-top:20px;" onclick="closeSettings()">Save Settings</button>
  </div>

  <!-- CORE APP LOGIC -->
  <script>
    // 1. Login Logic
    function doLogin() {
      // Basic mock login
      document.getElementById('loginOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loginOverlay').style.display = 'none';
      }, 400);
    }

    // 10. Settings & Appearance Logic
    function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
    
    function changeAppearance() {
      let size = document.getElementById('settingSize').value;
      let color = document.getElementById('settingColor').value;
      
      document.documentElement.style.setProperty('--signal-size', size);
      document.documentElement.style.setProperty('--gold-bright', color);
      document.documentElement.style.setProperty('--gold', color);
    }

    // View Switcher
    function showView(view) {
      document.getElementById('view-signals').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById('view-' + view).classList.remove('hidden');
    }

    // 11. Auto Detect Logic (Crypto vs Forex & Long vs Short)
    function autoDetectTrade() {
      let pair = document.getElementById('deployPair').value.toUpperCase();
      let entry = parseFloat(document.getElementById('deployEntry').value);
      let tp1 = parseFloat(document.getElementById('deployTP1').value);

      if(!pair || isNaN(entry) || isNaN(tp1)) {
        document.getElementById('deployMarket').value = '';
        document.getElementById('deployDir').value = '';
        return;
      }

      // Detect Market
      let market = 'FOREX';
      let cryptoCoins = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'DOGE', 'ADA'];
      // If it has USDT or is in crypto list
      if(pair.includes('USDT') || cryptoCoins.some(c => pair.includes(c))) {
        market = 'CRYPTO';
      }
      document.getElementById('deployMarket').value = market;

      // Detect Direction
      let dir = '';
      if(tp1 > entry) {
        dir = (market === 'CRYPTO') ? 'LONG' : 'BUY';
      } else if (tp1 < entry) {
        dir = (market === 'CRYPTO') ? 'SHORT' : 'SELL';
      }
      document.getElementById('deployDir').value = dir;
      
      // Visual feedback colors
      let dirField = document.getElementById('deployDir');
      if(dir === 'LONG' || dir === 'BUY') {
        dirField.style.color = 'var(--green)';
      } else {
        dirField.style.color = 'var(--red)';
      }
    }

    // 4, 7 & 8. WebSocket & Live Price Ticking Logic
    let previousPrices = {};
    
    // Connect to Binance WebSocket for live crypto prices
    const binanceWS = new WebSocket('wss://stream.binance.com:9443/ws/!ticker@arr');
    
    binanceWS.onmessage = function(event) {
      let data = JSON.parse(event.data);
      // Let's filter for BTCUSDT as an example (since we have a dummy card for it)
      let btcData = data.find(tick => tick.s === 'BTCUSDT');
      
      if(btcData) {
        updatePriceUI('BTCUSDT', parseFloat(btcData.c));
      }
    };

    // Update Price UI with Green/Red Flashing and PnL calc
    function updatePriceUI(symbol, currentPrice) {
      let priceEl = document.getElementById('price-' + symbol);
      let pnlEl = document.getElementById('pnl-' + symbol);
      if(!priceEl) return;

      let oldPrice = previousPrices[symbol] || currentPrice;
      
      // Update text
      priceEl.innerText = currentPrice.toFixed(2);

      // Remove old color classes
      priceEl.classList.remove('price-up', 'price-down');

      // Tick Animation Logic
      if(currentPrice > oldPrice) {
        priceEl.classList.add('price-up');
      } else if (currentPrice < oldPrice) {
        priceEl.classList.add('price-down');
      }

      // Calculate Dummy PnL (Assumed Entry is 63000 for our static BTC card, Position: Long, Lot: 0.1)
      let entry = 63000.0;
      let diff = currentPrice - entry;
      // Dummy Lot size multiplier
      let pnl = diff * 0.1; 
      
      pnlEl.innerText = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
      pnlEl.style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';

      // Save as old price for next tick
      previousPrices[symbol] = currentPrice;
    }

    // 4. Force App Refresh Loop (Fallback for UI sync every second)
    setInterval(() => {
       // This loop runs every second. 
       // WebSocket already updates instantly, but this can be used for API polling for Forex.
       
       let forexKey = document.getElementById('apiLondonEdge').value;
       if(forexKey) {
          // Here you would put the fetch() call for LondonStrategicEdge API
          // fetch(`https://api.londonstrategicedge.com/live?key=${forexKey}`)
          // .then(...) 
          // For now, it's ready and waiting for your real API endpoint.
       }
    }, 1000);

  </script>
</body>
</html>
